<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Rapprochement a déménagé - Forestar</title>
<style>
  :root { --bg: #f6f7f4; --card: #fff; --fg: #1d2420; --muted: #5d6a62; --accent: #2f7a4d; --on-accent: #ffffff; --line: #d9dfd9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141916; --card: #1b221e; --fg: #e4ebe6; --muted: #9aa89f; --accent: #6cc08d; --on-accent: #10241a; --line: #2c3630; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
    background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 32rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 32px 24px; }
  img { display: block; margin-bottom: 16px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 16px; color: var(--muted); }
  a.btn { display: inline-block; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600;
    padding: 12px 20px; border-radius: 8px; }
  a.btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .url { font-family: ui-monospace, monospace; color: var(--fg); }
</style>
</head>
<body>
<main>
  <img src="/logo-70x70.png" alt="Forestar" width="56" height="56">
  <h1>Le rapprochement bancaire a déménagé</h1>
  <p>L'application s'appelle maintenant « Rapprochement » et se trouve à une nouvelle adresse :
    <span class="url">rapprochement.forestar.be</span></p>
  <p>Cette ancienne adresse ne fonctionne plus. Pensez à mettre à jour vos favoris.</p>
  <a class="btn" href="https://rapprochement.forestar.be/">Ouvrir Rapprochement</a>
</main>
</body>
</html>
